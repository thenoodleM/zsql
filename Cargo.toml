[package]
name = "zsql"
version = "0.1.0"
edition = "2021"
description = "Lossless column-aware compressor for mysqldump files"

[dependencies]
zstd = { version = "0.13", features = ["zstdmt"] }
xz2 = { version = "0.1", features = ["static"] }
blake3 = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
